<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFD100">
  <title>POS Meseros - Mauitop</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/meseros.css">

</head>

<body>

  <!-- PANTALLA 1: LOGIN -->
  <div id="login-screen" class="screen active-screen login-container">
    <div class="login-card">
      <div
        style="width:160px; height:54px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; margin: 0 auto 16px;">
        <img src="img/logo.png" alt="Mauitop"
          style="width:100%; height:auto; position:absolute; top:50%; transform:translateY(-50%);">
      </div>
      <h1 style="font-size:20px; margin-bottom: 8px; color:white;">Acceso Meseros</h1>
      <p style="color:#9ca3af; margin-bottom: 24px; font-size:14px;">Inicia sesión para gestionar mesas</p>
      <form id="login-form">
        <input type="email" id="email" placeholder="Correo asignado" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit" class="btn btn-primary" id="btn-login">Entrar al Sistema</button>
      </form>
      <p id="login-error" style="color:#ef4444; font-size:14px; margin-top:16px; display:none;"></p>
    </div>
  </div>

  <!-- PANTALLA 2: MESAS -->
  <div id="tables-screen" class="screen">
    <div class="header">
      <span id="waiter-name" class="waiter-badge">Cargando...</span>
      <div class="header-actions">
        <button class="btn-icon theme-toggle" title="Alternar Tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="btn-icon" id="btn-logout" title="Cerrar sesión">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
    <div class="tables-section">
      <div class="section-title">Plano del Salón</div>
      <div id="tables-grid" class="tables-grid"></div>
    </div>
  </div>

  <!-- PANTALLA 3: PUNTO DE VENTA (TOMA Y VISUALIZACIÓN DE PEDIDO) -->
  <div id="pos-screen" class="screen">
    <div class="header">
      <button class="btn-icon" id="btn-back-tables">←</button>
      <span id="pos-table-number" style="font-weight:800;font-size:17px;letter-spacing:-0.3px;">Mesa X</span>
      <button class="btn-icon theme-toggle" title="Alternar Tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>

    <!-- Info de mesa ocupada -->
    <div id="occupied-info" style="display:none; padding:24px; margin:20px; border-radius:24px;">
      <h3 style="color:var(--danger); margin-bottom:16px; display:flex; align-items:center; gap:8px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Mesa Ocupada
      </h3>
      <div id="occupied-items" style="font-size:15px; color:var(--text-muted); margin-bottom:24px; line-height:1.6;">
      </div>
      <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:18px; margin-bottom:16px;">
        <span>Por cobrar:</span>
        <span id="occupied-total">$0</span>
      </div>
      <!-- Acciones de mesa -->
      <div style="display:flex; gap:10px;">
        <button class="btn btn-transfer" onclick="openTransferModal()" style="flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1v22M4 5l13-3 3 17-13 3"/></svg>
          Cambiar Mesa
        </button>
        <button class="btn btn-success" id="btn-pay-table" onclick="openPayModal()" style="flex:2; padding:16px; font-size:18px; display:inline-flex; align-items:center; justify-content:center; gap:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Cobrar y Liberar Mesa
        </button>
      </div>
    </div>

    <!-- Toma de Pedido Nuevo -->
    <div id="new-order-container" style="display:none;">
      <!-- Categorías -->
      <div class="cats-scroll" id="pos-cats"></div>

      <!-- Productos -->
      <div class="products-list" id="pos-products"></div>

      <!-- Footer Carrito Flotante -->
      <div class="cart-footer" id="pos-cart-footer">
        <div class="cart-summary">
          <div class="cart-label">Pedido actual <span id="cart-qty">0</span></div>
          <div class="cart-total-amount" id="cart-total">$0</div>
        </div>
        <button class="custom-order-btn" id="btn-send-order">
          <span>Enviar a Cocina</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Cobro con Método de Pago -->
  <div id="pay-modal" class="pay-modal-overlay">
    <div class="pay-modal-card">
      <div class="pay-modal-header">
        <h3 style="display:inline-flex; align-items:center; gap:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Cobrar Mesa
        </h3>
        <span id="pay-modal-table" style="font-size:14px; color:var(--text-muted); font-weight:600;"></span>
      </div>
      <div id="pay-modal-items" class="pay-modal-items"></div>
      <div class="pay-modal-total">
        <span>Total a cobrar</span>
        <span id="pay-modal-total">$0</span>
      </div>
      <p style="font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.5px;">Método de pago</p>
      <div class="pay-methods-grid">
        <button class="pay-method-btn" id="pm-efectivo" onclick="selectPayMethod('Efectivo', this)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span>Efectivo</span>
        </button>
        <button class="pay-method-btn" id="pm-nequi" onclick="selectPayMethod('Nequi / Daviplata', this)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          <span>Nequi/Daviplata</span>
        </button>
        <button class="pay-method-btn" id="pm-tarjeta" onclick="selectPayMethod('Tarjeta', this)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Tarjeta</span>
        </button>
      </div>
      <div style="display:flex; gap:12px; margin-top:20px;">
        <button class="btn" onclick="closePayModal()" style="flex:1; background:var(--bg-input); color:var(--text-muted);">Cancelar</button>
        <button class="btn btn-success" id="btn-confirm-pay" onclick="confirmPayTable()" disabled style="flex:1.5; font-size:16px;">Confirmar Cobro</button>
      </div>
    </div>
  </div>

  <!-- ── Modal de Transferencia de Mesa ── -->
  <div id="transfer-modal" class="pay-modal-overlay">
    <div class="pay-modal-card">
      <div class="pay-modal-header">
        <h3 style="display:inline-flex; align-items:center; gap:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1v22M4 5l13-3 3 17-13 3"/></svg>
          Cambiar Mesa
        </h3>
        <span id="transfer-current-label" style="font-size:14px; color:var(--text-muted); font-weight:600;"></span>
      </div>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">
        Selecciona la mesa destino. Solo se muestran las mesas libres.
      </p>
      <!-- Grid de mesas generado por JS -->
      <div id="transfer-modal-grid" class="transfer-grid"></div>
      <div style="margin-top:20px;">
        <button class="btn" onclick="closeTransferModal()" style="width:100%; background:var(--bg-input); color:var(--text-muted);">Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/meseros.js"></script>
</body>

</html>
