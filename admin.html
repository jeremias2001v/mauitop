<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Mauitop - Productos</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    body { background:#f6f4ec; color:#3b2a16; padding:24px; }
    .admin-header { max-width:1200px; margin:0 auto 22px; display:flex; justify-content:space-between; align-items:center; }
    .admin-card { background:white; border-radius:16px; box-shadow:0 4px 15px rgba(0,0,0,.1); padding:20px; max-width:1200px; margin:0 auto 20px; }
    .admin-form { display:grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap:14px; align-items:end; margin-bottom:20px; }
    .admin-form label { font-size:13px; color:#666; margin-bottom:6px; display:block; }
    .admin-form input, .admin-form select, .admin-form textarea { width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:8px; font-size:14px; }
    .admin-form textarea { resize:vertical; }
    .admin-table { width:100%; border-collapse:collapse; }
    .admin-table th, .admin-table td { padding:10px 8px; border:1px solid #e3ddd2; text-align:left; }
    .admin-table th { background:#f7f1e5; }
    .admin-actions button { margin-right:6px; }
    .small-note{font-size:12px;color:#666;margin-top:6px;}
  </style>
</head>
<body class="admin">
  <!-- Modal de login -->
  <div id="login-modal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; display:flex; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:16px; max-width:360px; width:90%; text-align:center; box-shadow:0 16px 40px rgba(0,0,0,0.2);">
      <h2 style="margin-top:0; font-size:24px; color:#2c2a2e;">Acceso al Panel</h2>
      <p style="color:#666; margin:10px 0 20px;">Ingresa la contraseña para continuar</p>
      <form id="login-form" onsubmit="handleLogin(event)">
        <input type="password" id="login-password" placeholder="Contraseña" required style="width:100%; padding:12px; border:1px solid #ccc; border-radius:10px; font-size:14px; margin-bottom:16px;">
        <button type="submit" class="hero-badge" style="width:100%; background:#5b37f3; color:white; padding:12px; border:none; border-radius:10px; font-weight:600; cursor:pointer;">Ingresar</button>
      </form>
      <p id="login-error" style="color:#e65364; font-size:13px; margin-top:10px; display:none;"></p>
    </div>
  </div>

  <div id="admin-content" style="display:none;">
  <div class="admin-header">
    <h1>Panel de Administración de Productos</h1>
    <div style="display:flex; gap:10px;">
      <button onclick="handleLogout(); setTimeout(() => window.location.href='index.html', 200);" class="hero-badge" style="background:#e65364;">Cerrar sesión</button>
      <a class="hero-badge" href="index.html">Volver al sitio</a>
    </div>
  </div>

  <div id="admin-msg" style="max-width:1200px;margin:0 auto 16px; padding:12px 16px; border-radius:10px; display:none;"></div>

  <div class="admin-card">
    <h2>Categorías</h2>
    <button onclick="openCatModal()" class="hero-badge" style="margin-bottom:20px;">Agregar Categoría</button>
    <table class="admin-table" id="cats-table">
      <thead>
        <tr><th>Nombre</th><th>Etiqueta</th><th>Acciones</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="admin-card">
    <h2>Productos actuales</h2>
    <button onclick="openProdModal()" class="hero-badge" style="margin-bottom:20px;">Agregar Producto</button>
    <table class="admin-table" id="products-table">
      <thead>
        <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Disponible</th><th>Acciones</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Modal para agregar/editar producto -->
  <div id="prod-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:20px; border-radius:8px; max-width:480px; width:90%;">
      <h3>Agregar Producto</h3>
      <form id="prod-form" onsubmit="handleProdSubmit(event)">
        <input type="hidden" id="p-id" />
        <label>Nombre</label>
        <input type="text" id="p-nombre" required />
        <label>Categoría</label>
        <select id="p-categoria" required></select>
        <label>Precio</label>
        <input type="number" id="p-precio" min="0" step="500" required />
        <label>URL de Imagen</label>
        <input type="url" id="p-imagen" placeholder="https://ejemplo.com/imagen.jpg" required />
        <div id="img-preview-container" style="display:none; margin-top:8px;">
          <span style="font-size:13px;color:#666;">Preview (solo cuando se edita):</span>
          <img id="img-preview" src="" style="width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid #ddd;margin-top:6px;" />
        </div>
        <label>Descripción</label>
        <textarea id="p-desc" rows="3" required></textarea>
        <label>Disponible</label>
        <select id="p-disponible">
          <option value="true">Sí</option>
          <option value="false">No</option>
        </select>
        <div class="modal-actions">
          <button type="button" onclick="closeProdModal()">Cancelar</button>
          <button type="submit" class="hero-badge" id="submit-btn" style="min-width:140px;">Agregar producto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para agregar categoría -->
  <div id="cat-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:white; padding:20px; border-radius:8px; max-width:400px; width:90%;">
      <h3>Agregar Categoría</h3>
      <form id="cat-form" onsubmit="handleCatSubmit(event)">
        <label>Nombre (clave única)</label>
        <input type="text" id="c-nombre" required />
        <label>Etiqueta (display)</label>
        <input type="text" id="c-label" required />
        <label>Emoji</label>
        <input type="text" id="c-emoji" maxlength="2" required />
        <label>Color (CSS gradient)</label>
        <input type="text" id="c-color" placeholder="linear-gradient(135deg,#FFD100,#FF6B00)" required />
        <div class="modal-actions">
          <button type="submit" class="hero-badge">Agregar</button>
          <button type="button" onclick="closeCatModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de confirmación (reutilizable) -->
  <div id="confirm-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:1100; align-items:center; justify-content:center;">
    <div style="background:white; padding:18px 20px; border-radius:12px; max-width:360px; width:90%; text-align:center;">
      <p id="confirm-text" style="margin:0 0 14px; line-height:1.4; color:#222; font-weight:600;"></p>
      <div style="display:flex; justify-content:center; gap:10px;">
        <button type="button" class="hero-badge" style="background:#e65364;" onclick="cancelConfirm()">Cancelar</button>
        <button type="button" class="hero-badge" id="confirm-yes-btn" onclick="executeConfirm()">Confirmar</button>
      </div>
    </div>
  </div>
  </div><!-- Cierre de admin-content -->

  <script src="js/admin.js"></script>
</body>
</html>
