<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cocina — Mauitop</title>
  <meta name="description" content="Pantalla de cocina en tiempo real para el restaurante Mauitop.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="css/cocina.css">
</head>

<body>

  <!-- PANTALLA 1: LOGIN -->
  <div id="login-screen" class="screen active-screen">
    <div class="login-container">
      <div class="login-card">
        <div style="margin-bottom:16px; line-height:1; display:flex; justify-content:center;">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--cooking)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
        </div>
        <h1>Pantalla de Cocina</h1>
        <p>Inicia sesión para ver los pedidos en tiempo real</p>
        <form id="login-form">
          <input type="email" id="email" placeholder="Correo" required autocomplete="email">
          <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
          <button type="submit" class="login-btn" id="btn-login">Entrar a Cocina</button>
        </form>
        <p id="login-error" style="color:#ef4444; font-size:14px; margin-top:16px; display:none;"></p>
      </div>
    </div>
  </div>

  <!-- PANTALLA 2: COCINA -->
  <div id="kitchen-screen" class="screen">

    <header class="kitchen-header">
      <div class="kitchen-header-left">
        <span class="kitchen-title">Mauitop — Cocina</span>
        <span class="order-count-badge" id="order-count">0 pedidos</span>
      </div>
      <div class="kitchen-clock" id="kitchen-clock">00:00:00</div>
      <button class="header-logout" id="btn-logout" style="display:inline-flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Salir
      </button>
    </header>

    <div id="orders-container"></div>

  </div>

  <script type="module" src="js/cocina.js"></script>
</body>

</html>
